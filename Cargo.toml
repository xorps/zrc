[package]
name = "zrc"
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
description = "A libc-free, allocation-free OCI container runtime (runc alternative) in Rust"
license = "Apache-2.0"
repository = "https://github.com/xorps/zrc"
# A static binary for *-unknown-none, distributed prebuilt: `cargo install`
# would ignore .cargo/config.toml and build it wrong.
publish = false

[[bin]]
name = "zrc"
path = "src/main.rs"

[dependencies]
xorpio = "0.1.0-alpha.1"

[features]
default = []
# Sysbox-style system containers: automatic user and cgroup namespaces.
# Off by default; even when compiled in, a container opts in with the
# `org.zrc.sysbox` annotation.
sysbox = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(zrc_find_panics)"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
