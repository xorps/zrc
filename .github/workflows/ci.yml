name: CI

on:
  push:
    # release.yml runs this for main.
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # rustup installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: make check

  # Release builds (which fail to link if a panic path is left), then the
  # end-to-end and containerd tests as root, on native amd64 and arm64.
  e2e:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: make e2e e2e-containerd ARCH=${{ matrix.arch }}
